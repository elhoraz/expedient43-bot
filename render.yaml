services:
  - type: web
    name: expedient43-bot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npx tsx scripts/wa-gateway.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ADMIN_WA_PHONE
        value: 6282142877426
      - key: WA_GROUP_OFFICIAL_ID
        value: 120363407294140739@g.us
      - key: WA_GROUP_COMMUNITY_ID
        value: 120363388633880584@g.us
      - key: WA_GROUP_DESIGN_ID
        value: 120363404648728200@g.us
